[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-bilidownloader-woju"
version = "0.2.4"
description = "哔哩哔哩文件下载器插件 for NoneBot2"
authors = [{name = "Wojusensei", email = "3442006415@qq.com"}]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.0.0",
    "bilibili-api-python>=17.0.0",
    "httpx>=0.24.0",
    "nonebot-plugin-localstore>=0.5.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/Wojusensei/nonebot-plugin-bilidownloader-woju"

[tool.setuptools]
packages = ["nonebot_plugin_bilibili_downloader"]
